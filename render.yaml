services:
  - name: cartman-server
    type: web
    runtime: node
    region: singapore # closest Render region to the Supabase ap-northeast-1 project
    plan: standard
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    autoDeployTrigger: commit
    # Supabase migrations (cartman-mobile/supabase/migrations/) are the source of truth
    # for DDL. schema.prisma mirrors them. --accept-data-loss allows non-interactive
    # deployments to proceed when Prisma schema syncs.
    preDeployCommand: npx prisma db push --accept-data-loss
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CORS_ORIGINS
        sync: false

      # Supabase Postgres — transaction-mode pooler (app runtime queries)
      - key: DATABASE_URL
        sync: false
      # Supabase Postgres — session-mode pooler (used by `prisma db push`)
      - key: DIRECT_URL
        sync: false

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_WEBHOOK_SECRET
        sync: false

      - key: SEMAPHORE_API_KEY
        sync: false
      - key: SEMAPHORE_SENDER_NAME
        value: CARTMAN

      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: noreply@cartmanph.com

      # Secret (sk.*) Mapbox token for the /geo/* geocoding proxy. Distinct
      # from the app's public tile token — and note the basemap itself uses
      # keyless CARTO tiles, so this is the only map secret. Unset is safe:
      # geocoding fails soft to empty results.
      - key: MAPBOX_TOKEN
        sync: false
