services:
  - name: cartman-server
    type: web
    runtime: node
    region: singapore # closest Render region to the Supabase ap-northeast-1 project
    plan: standard
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    autoDeployTrigger: commit
    # ─────────────────────────────────────────────────────────────────────
    # There is deliberately NO preDeployCommand. This service does not own
    # the schema and must not change it on deploy.
    #
    # It used to run `npx prisma db push --accept-data-loss` here. With
    # `autoDeployTrigger: commit` above, that pointed Prisma at production on
    # every single push, and `db push` drops whatever `schema.prisma` does
    # not mention. On 2026-08-20 that was found to have removed
    # `merchants.busy_until`, `push_outbox` and `order_messages` from
    # CartmanPH — the first broke every food and grocery order placed through
    # `place_order`, the second broke every insert and status update on
    # `orders`, because their triggers survived and the table did not.
    # `db push` writes no `_prisma_migrations` row, so it left no trace and
    # the migrations still read as applied.
    #
    # DDL comes from cartman-mobile/supabase/migrations/, applied with the
    # Supabase CLI or supabase/scripts/apply-pending.mjs. The Prisma client is
    # generated in `postinstall`, which needs no database.
    # ─────────────────────────────────────────────────────────────────────
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CORS_ORIGINS
        sync: false

      # Supabase Postgres — transaction-mode pooler (app runtime queries)
      - key: DATABASE_URL
        sync: false
      # Supabase Postgres — session-mode pooler. Kept for `npm run db:drift`
      # and for one-off introspection; nothing on the deploy path writes DDL.
      - key: DIRECT_URL
        sync: false

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_WEBHOOK_SECRET
        sync: false

      - key: SEMAPHORE_API_KEY
        sync: false
      - key: SEMAPHORE_SENDER_NAME
        value: CARTMAN

      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: noreply@cartmanph.com

      # Secret (sk.*) Mapbox token for the /geo/* geocoding proxy. Distinct
      # from the app's public tile token — and note the basemap itself uses
      # keyless CARTO tiles, so this is the only map secret. Unset is safe:
      # geocoding fails soft to empty results.
      - key: MAPBOX_TOKEN
        sync: false
